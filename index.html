<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script>
/* Old record-explorer links (?view=…, ?record=…, ?q=…) open the record graph, at their record if they name one. */
if (location.search) { const r = new URLSearchParams(location.search).get("record"); location.replace(location.pathname + (r ? "#graph/" + encodeURIComponent(r) : "#graph")); }
</script>
<title>Safety Research Atlas</title>
<meta name="description" content="Open research questions on the debate safety case, ranked by the step they affect, with what later work settled and what is left.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Schibsted+Grotesk:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<style>
:root{
  --bg:#fbfaf7; --surface:#ffffff; --sunk:#f3f1ec; --ink:#1b1c1a; --ink2:#55574f; --muted:#86887f;
  --line:#e7e4dc; --line2:#d5d2c8; --halo:#f3f1ec;
  --builds:#2a78d6; --agrees:#1baf7a; --disputes:#eb6834; --related:#a2a49b; --topic:#c3c4bc;
  --seq:#256abf; --steps:#c98500; --seq-soft:#86b6ef; --seq-ink:#ffffff; --seq-soft-ink:#10233d; --mark:#fff3c4;
  --ev-weak:#86b6ef; --ev-weak-ink:#10233d; --ev-sup:#256abf; --ev-sup-ink:#ffffff; --ev-con:#eb6834; --ev-con-ink:#1b1c1a;
  --lg-proved:#1baf7a; --lg-problem:#eb6834; --lg-derived:#6250d6; --lg-partly:#256abf; --lg-narrowed:#86b6ef; --lg-answered:#184f95;
  --g-proved:#1b1c1a; --g-multi:#184f95; --g-single:#3987e5; --g-prelim:#9ec5f4;
  --area0:#2a78d6; --area1:#1baf7a; --area2:#eda100;
  --k0:#2a78d6; --k1:#eb6834; --k2:#1baf7a; --k3:#eda100; --k4:#e87ba4; --k5:#008300;
  --fp1:#cde2fb; --fp2:#9ec5f4; --fp3:#6da7ec; --fp4:#3987e5; --fp5:#256abf; --fp6:#184f95; --fp7:#0d366b;
  --shadow:0 1px 2px rgba(27,28,26,.05),0 12px 32px rgba(27,28,26,.08);
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#131412; --surface:#1b1c1a; --sunk:#222320; --ink:#ecebe5; --ink2:#b3b2aa; --muted:#878780;
  --line:#2c2d2a; --line2:#3a3b37; --halo:#222320;
  --builds:#3987e5; --agrees:#199e70; --disputes:#d95926; --related:#7b7c76; --topic:#555651;
  --seq:#3987e5; --steps:#c98500; --seq-soft:#1c5cab; --seq-ink:#0b1a2e; --seq-soft-ink:#ffffff; --mark:#4a3f12;
  --ev-weak:#1c5cab; --ev-weak-ink:#ffffff; --ev-sup:#86b6ef; --ev-sup-ink:#0b1a2e; --ev-con:#d95926; --ev-con-ink:#1b1c1a;
  --lg-proved:#199e70; --lg-problem:#d95926; --lg-derived:#9085e9; --lg-partly:#3987e5; --lg-narrowed:#1c5cab; --lg-answered:#86b6ef;
  --g-proved:#ecebe5; --g-multi:#9ec5f4; --g-single:#3987e5; --g-prelim:#1c5cab;
  --area0:#3987e5; --area1:#199e70; --area2:#c98500;
  --k0:#3987e5; --k1:#d95926; --k2:#199e70; --k3:#c98500; --k4:#d55181; --k5:#008300;
  --fp1:#223f66; --fp2:#1f5291; --fp3:#1c5cab; --fp4:#2f74c9; --fp5:#3987e5; --fp6:#6da7ec; --fp7:#9ec5f4;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 32px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#131412; --surface:#1b1c1a; --sunk:#222320; --ink:#ecebe5; --ink2:#b3b2aa; --muted:#878780;
  --line:#2c2d2a; --line2:#3a3b37; --halo:#222320;
  --builds:#3987e5; --agrees:#199e70; --disputes:#d95926; --related:#7b7c76; --topic:#555651;
  --seq:#3987e5; --steps:#c98500; --seq-soft:#1c5cab; --seq-ink:#0b1a2e; --seq-soft-ink:#ffffff; --mark:#4a3f12;
  --ev-weak:#1c5cab; --ev-weak-ink:#ffffff; --ev-sup:#86b6ef; --ev-sup-ink:#0b1a2e; --ev-con:#d95926; --ev-con-ink:#1b1c1a;
  --lg-proved:#199e70; --lg-problem:#d95926; --lg-derived:#9085e9; --lg-partly:#3987e5; --lg-narrowed:#1c5cab; --lg-answered:#86b6ef;
  --g-proved:#ecebe5; --g-multi:#9ec5f4; --g-single:#3987e5; --g-prelim:#1c5cab;
  --area0:#3987e5; --area1:#199e70; --area2:#c98500;
  --k0:#3987e5; --k1:#d95926; --k2:#199e70; --k3:#c98500; --k4:#d55181; --k5:#008300;
  --fp1:#223f66; --fp2:#1f5291; --fp3:#1c5cab; --fp4:#2f74c9; --fp5:#3987e5; --fp6:#6da7ec; --fp7:#9ec5f4;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 32px rgba(0,0,0,.35); color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Schibsted Grotesk",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
a{color:inherit}
button{font:inherit;color:inherit}
.serif{font-family:"Source Serif 4",Georgia,"Times New Roman",serif}
.mono{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace}
.wrap{max-width:1200px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.muted{color:var(--muted)} .ink2{color:var(--ink2)}
h1,h2,h3{text-wrap:balance;margin:0}
.eyebrow{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:saturate(1.4) blur(12px);border-bottom:1px solid var(--line)}
.topin{display:flex;align-items:center;gap:18px;height:56px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-weight:650;letter-spacing:-.01em;white-space:nowrap}
.brand svg{flex:none}
.nav{display:flex;gap:2px;margin-left:auto}
.nav a{text-decoration:none;padding:7px 12px;border-radius:999px;color:var(--ink2);font-weight:500;font-size:14.5px;white-space:nowrap}
.nav a:hover{background:var(--sunk);color:var(--ink)}
.nav a.on{background:var(--ink);color:var(--bg)}
.sbtn{display:flex;align-items:center;gap:8px;border:1px solid var(--line2);background:var(--surface);border-radius:999px;padding:6px 8px 6px 12px;cursor:pointer;color:var(--ink2);font-size:14px}
.sbtn:hover{border-color:var(--ink2)}
kbd{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:11px;border:1px solid var(--line2);border-radius:6px;padding:1px 6px;color:var(--muted);background:var(--sunk)}
@media (max-width:980px){.brand span{display:none}.nav a{padding:7px 10px}.topin{gap:10px}}
@media (max-width:720px){
  .topin{flex-wrap:wrap;height:auto;padding-top:9px;gap:6px 10px}
  .brand span{display:inline;font-size:14.5px}
  .sbtn{margin-left:auto}.sbtn span,.sbtn kbd{display:none}.sbtn{padding:7px}
  .nav{order:3;width:100%;margin-left:0;justify-content:space-between;padding-bottom:7px}
  .nav a{padding:5px 9px;font-size:13.5px}
}

main{padding-block:28px calc(64px + env(safe-area-inset-bottom,0px))}
section{margin-top:44px}
.sechead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.sechead h2{font-size:20px;font-weight:650;letter-spacing:-.01em}

/* home (map) */
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:40px;align-items:center}
.hero h1{font-family:"Source Serif 4",Georgia,serif;font-weight:600;font-size:clamp(30px,4.2vw,46px);line-height:1.08;letter-spacing:-.02em}
.hero p.lede{color:var(--ink2);font-size:17px;max-width:46ch;margin:14px 0 22px}
.bigsearch{display:flex;align-items:center;gap:12px;width:100%;max-width:520px;border:1px solid var(--line2);background:var(--surface);border-radius:16px;padding:14px 16px;cursor:text;box-shadow:var(--shadow);color:var(--muted);font-size:16px;text-align:left}
.bigsearch:hover{border-color:var(--ink2)}
.tries{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);background:transparent;border-radius:999px;padding:4px 11px;font-size:13px;color:var(--ink2);cursor:pointer;text-decoration:none;white-space:nowrap}
.chip:hover{border-color:var(--ink2);color:var(--ink)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.stats{display:flex;flex-wrap:wrap;gap:22px;margin-top:26px}
.stat b{display:block;font-family:"JetBrains Mono",ui-monospace,monospace;font-weight:500;font-size:22px;letter-spacing:-.02em}
.stat span{font-size:12.5px;color:var(--muted)}
.mapbox{position:relative;min-width:0}
.lgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px 8px}
.ltile{display:flex;flex-direction:column;align-items:center;text-align:center;text-decoration:none;padding:6px 4px 12px;border-radius:16px;transition:background .15s;min-width:0}
.ltile:hover{background:var(--surface);box-shadow:var(--shadow)}
.ltile svg{width:100%;max-width:118px;height:auto;display:block;overflow:visible}
.ltile .bub{fill:var(--sunk);stroke:var(--line2);stroke-width:1;transition:stroke .15s}
.ltile:hover .bub{stroke:var(--ink)}
.ltile .pd{fill:var(--surface);stroke:var(--ink);stroke-width:1.3;transition:fill .15s}
.ltile:hover .pd{fill:var(--sunk)}
.ltile .pd:hover{fill:var(--ink)}
.ltile b{font-size:13.5px;font-weight:600;line-height:1.2;margin-top:2px;text-wrap:balance}
.ltile span{font-size:11.5px;color:var(--muted);margin-top:3px}
.maphint{font-size:12.5px;color:var(--muted);text-align:center;margin-top:4px}
.doors{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
@media (max-width:980px){.doors{grid-template-columns:repeat(2,minmax(0,1fr))}.hero{grid-template-columns:1fr;gap:18px}}
@media (max-width:520px){.doors{grid-template-columns:1fr}}
.door{display:flex;flex-direction:column;gap:12px;text-decoration:none;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;transition:transform .15s,border-color .15s,box-shadow .15s;min-width:0}
.door:hover{border-color:var(--line2);box-shadow:var(--shadow);transform:translateY(-2px)}
.door .pict{height:78px;border-radius:10px;background:var(--sunk);display:flex;align-items:center;justify-content:center}
.door .pict svg{width:150px;height:66px}
.door h3{font-size:16.5px;font-weight:600;letter-spacing:-.01em}
.door p{margin:0;font-size:13px;color:var(--muted)}
.feature{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:28px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px}
@media (max-width:860px){.feature{grid-template-columns:1fr}}
.feature h3{font-family:"Source Serif 4",Georgia,serif;font-size:24px;font-weight:600;line-height:1.2;letter-spacing:-.01em;margin:8px 0 10px}
.agents{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:24px;align-items:center;background:var(--sunk);border-radius:18px;padding:22px}
@media (max-width:860px){.agents{grid-template-columns:1fr}}
.agents h2{font-size:20px;font-weight:650}
.agents p{color:var(--ink2);margin:8px 0 0;font-size:14px}
.codeline{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.codeline code{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:12.5px;overflow-x:auto;white-space:nowrap;flex:1;min-width:0}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);background:var(--surface);border-radius:10px;padding:6px 11px;font-size:13px;cursor:pointer;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--ink2)}
.btn.dark{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* papers */
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;margin-bottom:14px}
.seg{display:inline-flex;background:var(--sunk);border-radius:999px;padding:3px}
.seg a{padding:5px 13px;border-radius:999px;text-decoration:none;font-size:13.5px;color:var(--ink2);font-weight:500}
.seg a.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.legend{display:flex;flex-wrap:wrap;gap:6px}
.legend .chip svg{flex:none}
.legend .chip.off{opacity:.4}
.switch{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--ink2);cursor:pointer;user-select:none}
.switch input{accent-color:var(--ink)}
.scrollx{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:var(--r);background:var(--surface);border:1px solid var(--line)}
.tlcard{display:grid;grid-template-columns:150px minmax(0,1fr);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
@media (max-width:640px){.tlcard{grid-template-columns:92px minmax(0,1fr)}}
.tlcard .scrollx{border:0;border-radius:0;background:transparent}
.tllanes{border-right:1px solid var(--line)}
.tllane{height:60px;display:flex;align-items:center;padding:0 10px 0 14px;font-size:13px;line-height:1.2;color:var(--ink2);font-weight:500;cursor:pointer;text-decoration:none}
.tllane:nth-child(odd){background:var(--sunk)}
.tllane:hover,.tllane.on{color:var(--ink);font-weight:650}
.tllane.on{background:color-mix(in srgb,var(--sunk) 60%,var(--mark))}
@media (max-width:640px){.tllane{font-size:11.5px;padding:0 6px 0 10px}}
.tl{display:block}
.tl .band{fill:var(--sunk)}
.tl .grid{stroke:var(--line);stroke-width:1}
.tl .yr{font-size:11px;fill:var(--muted);font-family:"JetBrains Mono",ui-monospace,monospace}
.tl .arc{fill:none;stroke-linecap:round;opacity:.5;cursor:pointer;transition:opacity .15s}
.tl .arc:hover{opacity:1}
.tl.hovering .arc.on{opacity:.95}
.tl .pnode{cursor:pointer;transition:opacity .15s}
.tl .pnode circle{fill:var(--surface);stroke:var(--ink);stroke-width:1.6}
.tl .pnode:hover circle,.tl .pnode.sel circle{fill:var(--ink)}
.tl .pnode text{font-size:10.5px;fill:var(--ink2);paint-order:stroke;stroke:var(--surface);stroke-width:3px;stroke-linejoin:round;pointer-events:none}
.tl .lanebg{fill:transparent}
.tl.hovering .arc:not(.on){opacity:.06}
.tl.hovering .pnode:not(.on){opacity:.22}
.tl.focus .pnode.dim{opacity:.2}
.tl.focus .arc.dim{opacity:.05}
.tl.focus .band.on{fill:color-mix(in srgb,var(--sunk) 60%,var(--mark))}
.path{display:flex;gap:0;overflow-x:auto;padding:4px 2px 10px}
.step{flex:0 0 190px;text-decoration:none;position:relative;padding-right:14px}
.step .dot{width:28px;height:28px;border-radius:50%;background:var(--ink);color:var(--bg);display:flex;align-items:center;justify-content:center;font-family:"JetBrains Mono",monospace;font-size:12px;position:relative;z-index:1}
.step::before{content:"";position:absolute;left:28px;right:0;top:13px;height:2px;background:var(--line2)}
.step:last-child::before{display:none}
.step b{display:block;font-size:13.5px;margin-top:8px}
.step span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:12.5px;color:var(--muted)}
.matrix{display:grid;min-width:780px}
.mx-h{position:sticky;top:0;background:var(--surface);z-index:1;font-size:11.5px;color:var(--ink2);font-weight:600;padding:12px 4px 10px;text-align:center;text-decoration:none;display:flex;flex-direction:column;align-items:center;gap:6px;border-bottom:1px solid var(--line)}
.mx-h:hover{color:var(--ink)}
.mx-h.first{text-align:left;align-items:flex-start;padding-left:14px}
.mx-lane{grid-column:1/-1;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:14px 14px 4px;border-top:1px solid var(--line)}
.mx-r{font-size:13px;padding:5px 8px 5px 14px;text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;position:sticky;left:0;background:var(--surface)}
.mx-r:hover{text-decoration:underline}
.mx-c{display:flex;align-items:center;justify-content:center;height:32px;text-decoration:none}
.mx-r{height:32px;line-height:22px}
.mx-c i{display:block;border-radius:50%;background:var(--ink);opacity:.78;transition:transform .12s,opacity .12s}
.mx-c:hover i{opacity:1;transform:scale(1.15)}
.mx-c i.z{background:var(--line2);opacity:1}

/* sheet */
.sheet{position:fixed;z-index:30;background:var(--surface);box-shadow:var(--shadow);overflow-y:auto;overscroll-behavior:contain;
  top:calc(56px + env(safe-area-inset-top,0px));right:0;bottom:0;width:min(440px,100vw);border-left:1px solid var(--line);
  padding:18px calc(20px + env(safe-area-inset-right,0px)) calc(28px + env(safe-area-inset-bottom,0px)) 20px}
.sheet.wide{width:min(620px,100vw)}
@media (max-width:720px){.sheet,.sheet.wide{top:auto;left:0;width:auto;max-height:82vh;border-left:0;border-top:1px solid var(--line);border-radius:18px 18px 0 0;
  padding:14px max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}}
.sheet .x{position:sticky;top:0;float:right;width:32px;height:32px;border-radius:50%;border:1px solid var(--line2);background:var(--surface);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:18px;line-height:1;z-index:2}
.sheet h2{font-family:"Source Serif 4",Georgia,serif;font-weight:600;font-size:22px;line-height:1.2;letter-spacing:-.01em;margin:6px 40px 6px 0}
.sheet h4{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:24px 0 10px;font-weight:600}
.meta{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:13px;color:var(--ink2);align-items:center}
.meta a{text-underline-offset:3px}
.waffle{display:grid;grid-template-columns:22px 104px minmax(0,1fr) 26px;gap:6px 6px;align-items:center;font-size:13px}
.waffle .kl{color:var(--ink2);white-space:nowrap}
.waffle .kn{font-family:"JetBrains Mono",monospace;font-size:12px;color:var(--muted);text-align:right}
.waffle .kl.hl{color:var(--ink);font-weight:650}
.sqs{display:flex;flex-wrap:wrap;gap:3px}
.sq{width:12px;height:12px;border-radius:3px;background:var(--line2);display:block}
.sq:hover{background:var(--ink)}
.sq.me{background:var(--ink);outline:2px solid var(--ink);outline-offset:1px}
.waffle .hlrow{background:var(--ink2)}
.conn{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;text-decoration:none;font-size:13.5px}
.conn:hover{background:var(--sunk)}
.conn .bar{width:4px;align-self:stretch;border-radius:2px;flex:none}
.conn .who{font-weight:600}
.conn .n{margin-left:auto;font-family:"JetBrains Mono",monospace;font-size:12px;color:var(--muted)}
.link{border-left:3px solid var(--line2);padding:2px 0 2px 12px;margin:14px 0}
.link .s{font-size:13.5px}
.link .s a{font-weight:600;text-underline-offset:3px}
.link .why{font-size:13px;color:var(--ink2);margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer}
.link .why.open{display:block;cursor:auto}
.tag{display:inline-block;font-size:11px;border-radius:6px;padding:1px 7px;background:var(--sunk);color:var(--ink2);margin-left:6px;white-space:nowrap}
.tag.topic{border:1px dashed var(--line2);background:transparent}

/* front door: gaps */
.ghead{margin-bottom:22px}
.gtitle{font-family:"Source Serif 4",Georgia,serif;font-weight:600;font-size:clamp(26px,3.4vw,38px);line-height:1.1;letter-spacing:-.02em;margin-top:8px}
.ghead .lede{color:var(--ink2);font-size:16px;max-width:62ch;margin:10px 0 0}

.rgfind:focus-within{border-color:var(--ink2)}
.rgfind input{border:0;outline:0;background:transparent;font:inherit;font-size:14px;color:var(--ink);min-width:0;width:100%}
.rgfind span{font-size:12px;white-space:nowrap}
.rgres{position:absolute;z-index:6;left:0;right:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:6px;display:grid;gap:1px}
.rgres[hidden]{display:none}
.rgres a{display:block;text-decoration:none;font-size:13.5px;color:var(--ink);padding:6px 9px;border-radius:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rgres a:hover,.rgres a:focus{background:var(--sunk);outline:0}
.rgleg .chip i,.rglist i,.rgdot{flex:none;width:9px;height:9px;border-radius:50%;background:var(--c);display:inline-block}
.rgleg .chip.on{background:var(--sunk);color:var(--ink);border-color:var(--ink2)}
.rgbox{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;height:min(74vh,780px);touch-action:pan-y}
.rgbox.zoomed{touch-action:none}
.rgbox svg{display:block;width:100%;height:100%;user-select:none;-webkit-user-select:none}
.rgbox.drag svg{cursor:grabbing}
.rgh{fill:var(--sunk);cursor:zoom-in}
.rgd{cursor:pointer;transition:opacity .15s}
.rgd.a0{fill:var(--area0)} .rgd.a1{fill:var(--area1)} .rgd.a2{fill:var(--area2)}
.rgsvg.dim .rgd:not(.hit){opacity:.12}
.rgd.sel{stroke:var(--ink);stroke-width:2.4px;vector-effect:non-scaling-stroke}
.rgl line{stroke:var(--ink);stroke-opacity:.38;stroke-width:1px;vector-effect:non-scaling-stroke}
.rgl circle{fill:none;stroke:var(--ink);stroke-width:1.4px;vector-effect:non-scaling-stroke}
.rglab text{fill:var(--ink);font-weight:600;paint-order:stroke;stroke:var(--surface);stroke-linejoin:round;cursor:zoom-in}
.rglab tspan{fill:var(--muted);font-weight:500}
.rgzoom{position:absolute;right:10px;bottom:10px;display:flex;flex-direction:column;gap:6px}
.rgzoom button{width:34px;height:34px;border-radius:10px;border:1px solid var(--line2);background:var(--surface);cursor:pointer;font-size:17px;line-height:1;display:flex;align-items:center;justify-content:center;color:var(--ink)}
.rgzoom button:hover{border-color:var(--ink2)}
.rgnote{font-size:13px;color:var(--muted);max-width:78ch;margin:12px 0 0}
.rglist{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:2px 14px}
.rglist button{display:flex;align-items:center;gap:9px;text-align:left;border:0;background:transparent;padding:6px 7px;border-radius:8px;cursor:pointer;font-size:13.5px;color:var(--ink2);min-width:0}
.rglist button:hover{background:var(--sunk);color:var(--ink)}
.rglist span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.rglist b{font-family:"JetBrains Mono",ui-monospace,monospace;font-weight:500;font-size:12px;color:var(--muted)}
.rgtext{font-family:"Source Serif 4",Georgia,serif;font-size:16px;line-height:1.55;margin:14px 0 0}
.rgstate{font-size:13px;color:var(--ink2);margin-top:12px}
.rgstate b{font-family:"JetBrains Mono",ui-monospace,monospace;font-weight:500;font-size:11.5px;background:var(--sunk);border-radius:6px;padding:2px 6px;margin-right:6px}
.rglinks{display:grid;gap:1px}
.rglinks a{display:block;text-decoration:none;font-size:13.5px;padding:5px 7px;border-radius:8px;color:var(--ink)}
.rglinks a:hover{background:var(--sunk)}
.rglinks .rel{display:block;font-size:11.5px;color:var(--muted)}
.rglinks .lk{justify-self:start;margin-top:6px}
.lk{border:0;background:transparent;padding:0;color:var(--ink2);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-size:13px}
.sheet .actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
@media (max-width:720px){.rgbox{height:62vh}}

<body>
<header class="top"><div class="wrap topin">
  <a class="brand" href="#gaps" aria-label="Safety Research Atlas, open questions">
    <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><path d="M6 19 L12 7 L20 15" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M6 19 Q14 23 20 15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-dasharray="2 2.4"/><circle cx="6" cy="19" r="3.2" fill="currentColor"/><circle cx="12" cy="7" r="3.2" fill="var(--bg)" stroke="currentColor" stroke-width="1.6"/><circle cx="20" cy="15" r="3.2" fill="currentColor"/></svg>
    <span>Safety Research Atlas</span></a>
  <nav class="nav" aria-label="Views"><a href="overview.html">Overview</a><a href="#gaps" data-v="gaps">Gaps</a><a href="#discoveries" data-v="ledger">Discoveries</a><a href="#results" data-v="results">Results</a><a href="#map" data-v="map">Map</a><a href="#papers" data-v="papers">Papers</a><a href="#graph" data-v="graph">Graph</a><a href="#assumptions" data-v="assumptions" hidden>Assumptions</a><a href="#proofs" data-v="proofs" hidden>Proofs</a></nav>
  <button class="sbtn" id="openSearch" type="button" aria-label="Search the atlas"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M11 11l3.5 3.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg><span>Search</span><kbd>/</kbd></button>
</div></header>
<main class="wrap" id="app"><div class="empty">Loading the atlas…</div></main>

<div class="sover" id="search" hidden>
  <div class="spanel" role="dialog" aria-label="Search">
    <div class="sin"><svg width="18" height="18" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M11 11l3.5 3.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      <input id="q" type="search" placeholder="Search findings, papers and open questions" autocomplete="off" spellcheck="false"><kbd>esc</kbd></div>
    <div class="skinds" id="skinds"></div>

  </div>
</div>

<div class="pop" id="pop" hidden role="tooltip"></div>

<script>
"use strict";
const LIVE = "https://elshatlawy.github.io/AI-Safety-Research-Atlas-/";
const LANE_SHORT = ["Debate theory","Debate experiments","Multi-agent debate","Measuring oversight","Amplification & RRM","AI critiques & feedback","Prover–verifier games","Weak-to-strong","How oversight fails"];
const KINDS = [["result","Result","Results"],["theorem","Theorem","Theorems"],["claim","Claim","Claims"],["definition","Definition","Definitions"],["assumption","Assumption","Assumptions"],["limitation","Limitation","Limitations"],["open","Open question","Open questions"],["method","Method","Methods"],["citation","On other work","On other work"],["concept","Concept","Concepts"]];
const KMAP = Object.fromEntries(KINDS.map(k => [k[0], k]));
const FAM = {extends:"builds",depends:"builds",supports:"agrees",replicates:"agrees",challenges:"disputes",critiques:"disputes",fails:"disputes",addresses:"related",same:"related",topic:"topic"};
const FAMS = [["builds","Builds on"],["agrees","Agrees"],["disputes","Disputes"],["related","Related"],["topic","Shares a topic"]];
const FAMLABEL = Object.fromEntries(FAMS);
const VERB = {extends:"extends",depends:"depends on",supports:"supports",replicates:"replicates",challenges:"challenges",critiques:"critiques",fails:"fails to replicate",addresses:"addresses",same:"asks the same question as",topic:"shares a topic with"};
const REVIEW = {AI_CHECKED:["AI-checked","var(--agrees)","Two independent AI checks agree this record matches its quote"],CANNOT_TELL:["Unsettled","var(--related)","The AI checks could not settle this record"],AI_FLAGGED:["Flagged","var(--disputes)","An AI check flagged this record for a fix"]};
/* display order and glyph fill for the fixed status and evidence vocabularies; values themselves come from data.json */
const STATUS_ORDER = ["STILL_OPEN","NARROWED","PARTLY_ANSWERED_BY_LATER_WORK","ANSWERED_BY_LATER_WORK"];
const STATUS_FILL = {STILL_OPEN:0, NARROWED:.25, PARTLY_ANSWERED_BY_LATER_WORK:.5, ANSWERED_BY_LATER_WORK:1};
const EV_ORDER = ["NONE","WEAK","CONTESTED","SUPPORTED"];
const NKIND = {top_claim:"Top claim", claim:"Claim", defeater:"Defeater", assumption:"Assumption", open_problem:"Open problem", evidence_needed:"Evidence needed"};
const EVC = {NONE:"evn", WEAK:"evw", SUPPORTED:"evs", CONTESTED:"evc"};
const EFF_ORDER = ["ANSWERS","PARTLY_ANSWERS","NARROWS","CONTRADICTS_PREMISE","RELATED_ONLY"];
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const LG_VAR = {"Proved":"--lg-proved","Paper problem":"--lg-problem","Derived":"--lg-derived","Partly answered by later work":"--lg-partly","Narrowed":"--lg-narrowed","Answered by later work":"--lg-answered"};

let D, P, R, L, GQ, QBY, STEPS, STEP, BRANCHES, LG, CD, CARD_BY_R, ARX, ADJ, PREC, CASE = null, PAIRS = [], POOLED_E = null, lastStep;
const CN = {}, CKIDS = new Map();
const S = {fams:new Set(FAMS.map(f => f[0])), leads:false, pbase:"papers", kq:null, sk:null, step:null, gstatus:null, grade:null, openQ:null, back:"gaps", hops:1, lgoff:new Set(), focusStep:null, fam:null, focusFam:null, famPaper:null, bfam:null, ppaper:null, prob:null, pnode:null, lproj:null, lsel:null, lprob:null, flow:null};
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = n => n.toLocaleString("en-US");
const famColor = f => `var(--${f})`;
const human = s => { s = String(s ?? ""); return s ? s.charAt(0).toUpperCase() + s.slice(1).toLowerCase().replace(/_/g, " ") : ""; };
const plural = (n, one, many) => `${n} ${n === 1 ? one : (many || one + "s")}`;
const slug = s => String(s).toLowerCase().replace(/[^a-z0-9]+/g, "-");
const lgColor = l => `var(${LG_VAR[l] || "--related"})`;
const evCls = l => "ev-" + String(l || "").replace(/[^A-Za-z_]/g, "");

function kicon(k, size = 12) {
  const c = "currentColor", s = `width="${size}" height="${size}" viewBox="0 0 12 12" aria-hidden="true"`;
  const body = {
    result:`<circle cx="6" cy="6" r="4.4" fill="${c}"/>`,
    theorem:`<rect x="1.6" y="1.6" width="8.8" height="8.8" rx="1" fill="${c}"/>`,
    claim:`<path d="M6 .9 11.1 6 6 11.1.9 6z" fill="${c}"/>`,
    definition:`<path d="M1.5 3.2h9M1.5 6h9M1.5 8.8h9" stroke="${c}" stroke-width="1.5"/>`,
    assumption:`<path d="M6 1.6 10.6 10.2H1.4z" fill="none" stroke="${c}" stroke-width="1.5" stroke-linejoin="round"/>`,
    limitation:`<circle cx="6" cy="6" r="4.4" fill="none" stroke="${c}" stroke-width="1.4"/><path d="M6 1.6a4.4 4.4 0 0 1 0 8.8z" fill="${c}"/>`,
    open:`<circle cx="6" cy="6" r="4.4" fill="none" stroke="${c}" stroke-width="1.5" stroke-dasharray="2.1 1.6"/>`,
    method:`<path d="M1.2 6h8.6M6.6 2.6 10 6 6.6 9.4" fill="none" stroke="${c}" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>`,
    citation:`<path d="M1.6 2.8h3.6v3.4c0 2-1.1 3-2.9 3.2M6.8 2.8h3.6v3.4c0 2-1.1 3-2.9 3.2" fill="none" stroke="${c}" stroke-width="1.4"/>`,
    concept:`<circle cx="6" cy="6" r="2.6" fill="${c}"/>`,
    lean:`<path d="M3 1.5v9M3 6h7" fill="none" stroke="${c}" stroke-width="1.6" stroke-linecap="round"/>`,
    flask:`<path d="M4.3 1.2h3.4M4.9 1.2v3.3L1.9 9.7c-.4.7.1 1.3.8 1.3h6.6c.7 0 1.2-.6.8-1.3L7.1 4.5V1.2" fill="none" stroke="${c}" stroke-width="1.3" stroke-linejoin="round"/><path d="M3.1 7.6h5.8" stroke="${c}" stroke-width="1.2"/>`
  }[k] || "";
  return `<svg ${s}>${body}</svg>`;
}
function famSwatch(f, w = 18) {
  const dash = f === "topic" ? ' stroke-dasharray="3 3"' : "";
  return `<svg width="${w}" height="10" viewBox="0 0 ${w} 10" aria-hidden="true"><path d="M1 5h${w - 2}" stroke="${famColor(f)}" stroke-width="3" stroke-linecap="round"${dash}/></svg>`;
}
let CLIP = 0;
/* a square filled from the bottom: empty = still open, a quarter = narrowed, half = partly answered, full = answered */
function fracSVG(f, s = 40) {
  const r = Math.max(2, Math.round(s * .22)), i = s >= 24 ? 3 : 1.5, sw = s >= 24 ? 2 : 1.5, w = s - 2 * i, cid = "h" + (++CLIP);
  const out = `<rect x="${i}" y="${i}" width="${w}" height="${w}" rx="${r}" fill="none" stroke="var(--seq)" stroke-width="${sw}"/>`;
  let fill = "";
  if (f >= 1) fill = `<rect x="${i}" y="${i}" width="${w}" height="${w}" rx="${r}" fill="var(--seq)"/>`;
  else if (f > 0) fill = `<clipPath id="${cid}"><rect x="0" y="${(s - i - w * f).toFixed(2)}" width="${s}" height="${s}"/></clipPath><rect clip-path="url(#${cid})" x="${i}" y="${i}" width="${w}" height="${w}" rx="${r}" fill="var(--seq)"/>`;
  return `<svg width="${s}" height="${s}" viewBox="0 0 ${s} ${s}" aria-hidden="true">${fill}${out}</svg>`;
}
const statusSVG = (st, s) => fracSVG(STATUS_FILL[st] ?? 0, s);

async function boot() {
  try {
    const res = await fetch("data.json?v=3c7047487c65");
    if (!res.ok) throw new Error(res.status);
    D = await res.json();
  } catch (e) {
    $("#app").innerHTML = `<div class="empty">The atlas data could not be loaded.</div>`;
    return;
  }
  P = D.papers; R = D.records; L = D.links;
  GQ = (D.gap && D.gap.questions) || []; QBY = Object.fromEntries(GQ.map(q => [q.id, q]));
  STEPS = (D.gap && D.gap.steps) || []; STEP = Object.fromEntries(STEPS.map(s => [s.id, s]));
  STEPS.forEach(s => { s.qs = GQ.filter(q => (q.steps || []).includes(s.id)).sort((a, b) => a.rank - b.rank); });
  BRANCHES = []; STEPS.forEach(s => { if (!BRANCHES.includes(s.branch)) BRANCHES.push(s.branch); });
  BRANCHES = [...BRANCHES.filter(b => b !== "other"), ...BRANCHES.filter(b => b === "other")];
  LG = D.ledger || {entries:[], counts:{}}; CD = D.cards || {cards:[], grades:{}};
  CARD_BY_R = {}; CD.cards.forEach(c => { if (c.r != null) CARD_BY_R[c.r] = c; });
  CASE = D.case && (D.case.nodes || []).length ? D.case : null;
  if (CASE) CASE.nodes.forEach(n => { CN[n.id] = n; if (!CKIDS.has(n.parent)) CKIDS.set(n.parent, []); CKIDS.get(n.parent).push(n.id); });
  PAIRS = (D.pooled && D.pooled.pairs) || [];
  POOLED_E = (LG.entries || []).find(e => e.kind === "pooled_table") || null;
  ARX = Object.fromEntries(P.map((p, i) => [p.arxiv, i]));
  const seen = {};
  P.forEach((p, i) => { p.i = i; p.n = 0; p.base = p.short; (seen[p.short] = seen[p.short] || []).push(p); });
  Object.values(seen).forEach(list => { if (list.length > 1) list.sort((a, b) => a.year * 12 + a.month - b.year * 12 - b.month).forEach((p, j) => p.short = p.base + "abcdefgh"[j]); });
  P.forEach(p => { const sur = p.base.split(/ et al\.| & /)[0]; p.tag = `${sur} ’${String(p.year).slice(2)}${p.short.slice(p.base.length)}`; });
  PREC = P.map(() => []);
  R.forEach((r, i) => { r.i = i; P[r.p].n++; PREC[r.p].push(i); });
  ADJ = R.map(() => []);
  L.forEach((l, j) => { l.i = j; l.f = FAM[l.r] || "related"; ADJ[l.s].push(j); ADJ[l.t].push(j); l.ps = R[l.s].p; l.pt = R[l.t].p; });
  GQ.forEach(q => { q.lane = q.origin != null && R[q.origin] ? P[R[q.origin].p].lane : null; });
  bootDeps();
  window.addEventListener("hashchange", route);
  route();
}

/* ---------- routing ---------- */
let lastView = "";
function route() {
  const h = decodeURIComponent(location.hash.slice(1)).toLowerCase();
  let m, view;
  hideTip(); hidePop();
  if (!h || h === "gaps") view = ["gaps", null, null];
  else if ((m = h.match(/^q(\d+)$/))) view = ["gaps", "Q" + m[1].padStart(2, "0"), S.step];
  else if ((m = h.match(/^step=(.+)$/))) view = ["gaps", null, (STEPS.find(s => s.id.toLowerCase() === m[1]) || {}).id || null];
  else if (h === "discoveries") view = ["ledger"];
  else if (h === "results") view = ["results"];
  else if (h === "map" || h === "agents") view = ["map"];
  else if (h === "papers" || h === "matrix") view = ["papers", h, null];
  else if ((m = h.match(/^d([1-9])$/))) view = ["papers", "papers", +m[1] - 1];
  else if ((m = h.match(/^p(\d+)$/)) && P[+m[1]]) view = ["papers", null, null, "p", +m[1]];
  else if ((m = h.match(/^x(\d+)-(\d+)$/)) && P[+m[1]] && P[+m[2]]) view = ["papers", null, null, "x", +m[1], +m[2]];
  else if ((m = h.match(/^graph(?:\/(.+))?$/))) view = ["graph", m[1] || null];
  else if ((m = h.match(/^r(\d+)$/)) && R[+m[1]]) view = ["record", +m[1]];
  else if ((m = h.match(/^k-([a-z]+)$/)) && KMAP[m[1]]) view = ["kind", m[1]];
  else if ((m = h.match(/^assumptions(?:=(.*))?$/)) && DP) view = ["assumptions", m[1] ? m[1].toUpperCase() : null];
  else if ((m = h.match(/^proofs(?:=(.*))?$/)) && DP) view = ["proofs", m[1] || ""];
  else view = ["gaps", null, null];
  document.querySelectorAll(".nav a").forEach(a => a.classList.toggle("on", a.dataset.v === view[0]));
  const sheetQ = view[0] === "gaps" && view[1] && QBY[view[1]] ? QBY[view[1]] : null;
  if (view[0] !== "papers" && !sheetQ) closeSheet(true);
  if (view[0] === "map") renderMap();
  else if (view[0] === "papers") renderPapers(view);
  else if (view[0] === "gaps") {
    S.step = view[2] || null;
    S.openQ = sheetQ ? sheetQ.id : null;
    renderGaps();
    if (sheetQ) openQuestionSheet(sheetQ);
  }
  else if (view[0] === "ledger") renderLedger();
  else if (view[0] === "results") renderResults();
  else if (view[0] === "graph") renderGraph(view[1]);
  else if (view[0] === "record") renderRecord(view[1]);
  else if (view[0] === "kind") renderKind(view[1]);
  else if (view[0] === "assumptions") renderAssumptions(view[1]);
  else if (view[0] === "proofs") renderProofs(view[1]);
  const navOn = $(".nav a.on"), nav = $(".nav");
  if (!navOn && nav) nav.scrollLeft = 0;
  if (navOn && nav && nav.scrollWidth > nav.clientWidth) { const a = navOn.getBoundingClientRect(), b = nav.getBoundingClientRect(); if (a.left < b.left || a.right > b.right) nav.scrollLeft += a.left - b.left - (b.width - a.width) / 2; }
  const key = ["papers", "gaps", "assumptions", "proofs", "graph"].includes(view[0]) ? view[0] : h;
  if (key !== lastView) { window.scrollTo(0, 0); lastView = key; }
  if (h === "agents") $("#agents")?.scrollIntoView({block:"start"});
}

/* ---------- front door: gaps ---------- */
function branchSteps(b) { return STEPS.filter(s => s.branch === b); }
function renderGaps() {
  const qs = GQ.slice().sort((a, b) => a.rank - b.rank);
  if (!qs.length) { $("#app").innerHTML = `<div class="empty">No open questions in the data.</div>`; return; }
  const tally = {}; GQ.forEach(q => { tally[q.status] = (tally[q.status] || 0) + 1; });
  const statuses = [...STATUS_ORDER.filter(s => tally[s]), ...Object.keys(tally).filter(s => !STATUS_ORDER.includes(s))];
  const onCase = qs.filter(q => q.steps.length), offCase = qs.filter(q => !q.steps.length);
  const nPapers = new Set(GQ.map(q => q.asked_by)).size;
  if (S.gstatus && !tally[S.gstatus]) S.gstatus = null;
  const box = $("#treebox"), keep = box ? [box.scrollLeft, box.scrollTop] : null;
  const changed = S.step !== lastStep; lastStep = S.step;
  const hasStep = S.step && (CN[S.step] || STEP[S.step]);
  $("#app").innerHTML = `
    <div class="ghead">
      <div class="eyebrow">Debate safety case · open questions</div>
      <h1 class="gtitle">Where the debate safety case is still open</h1>
      <p class="lede">${GQ.length} questions from ${nPapers} papers, ranked by the step of the case they affect.</p>
    </div>
    <div class="gapwrap">
      ${CASE ? treeCard() : casePanelHTML()}
      <div class="ranked">
        ${hasStep ? `<div class="stepban" id="steppanel" aria-live="polite">${CASE ? stepPanel() : stepCaption()}</div>` : ""}
        <div class="rhead">
          <div class="sfilter" role="group" aria-label="Filter by status">${statuses.map(s => `<button type="button" class="sf${S.gstatus === s ? " on" : ""}" data-st="${esc(s)}" aria-pressed="${S.gstatus === s}">${statusSVG(s, 26)}<b>${tally[s]}</b><span>${esc(human(s))}</span></button>`).join("")}</div>
          <div class="iconkey">${CASE ? `<span>${miniTLKey()} later findings by date</span>` : ""}<span>${kicon("lean", 12)} Lean proof</span><span>${kicon("flask", 12)} experiment package</span></div>
        </div>

function pack(items, pad, iters = 360) {

    for (let i = 0; i < order.length; i++) for (let j = i + 1; j < order.length; j++) {

  for (let t = 0; t < iters; t++) step(0.04 * (1 - t / iters) + 0.004);
  for (let t = 0; t < 80; t++) step(0);

  document.querySelectorAll("#lcard .prow").forEach(r => { const on = r.dataset.prow === S.lprob; r.classList.toggle("on", on); r.querySelector(".prb").setAttribute("aria-pressed", on); });
}
function pickLean(i) { const lp = lpOf(S.lproj); if (!lp) return; S.lprob = null; S.lsel = S.lsel === i ? null : i; applyLean($(".lg2"), lp); }

/* ---------- cross-links: the families a result uses, its place in a proof graph; the families that name a step ---------- */
function famStrip(i) {
  if (!DP) return "";
  const g = GRID_BY_R[i], pn = uniq((PNODE_BY_R[i] || []).map(x => x.join("|"))).map(x => x.split("|"));
  if (!g && !pn.length) return "";
  const dots = g ? FKINDS.map(k => FCOLS.filter(f => f.kind === k).map(f => g.cells[f.id] ? `<a class="fdot2" href="#assumptions=${esc(f.id.toLowerCase())}" data-pop="cell:${g.k}|${esc(f.id)}" aria-label="${esc(f.name)}"></a>` : `<i class="fdot2"></i>`).join("")).join(`<i class="gap"></i>`) : "";
  return `<div class="fstrip">${g ? `<div class="eyebrow">Assumption families · ${g.n} of ${FCOLS.length}</div><span class="fdots" role="group" aria-label="${esc(`Uses ${plural(g.n, "of the assumption families", "of the assumption families")}`)}">${dots}</span>` : ""}${pn.map(([paper, k]) => { const pg = pgOf(paper), n = pg && pg.nodes[+k]; return n ? `<a class="plink" href="#proofs=${esc(paper)}&n=${encodeURIComponent(n.label)}">See in proof graph →</a>` : ""; }).join("")}</div>`;
}
function stepFams(id) {
  if (!DP) return "";
  const fs = DP.families.filter(f => f.steps.some(s => s.id === id));
  if (!fs.length) return "";
  return `<div class="spf"><span class="mlab">Assumption families</span>${fs.map(f => `<a class="chip${f.steps_state !== "AI_CHECKED" ? " unc" : ""}" href="#assumptions=${esc(f.id.toLowerCase())}" data-pop="fam:${esc(f.id)}">${esc(f.name)}</a>`).join("")}</div>`;
}

/* ---------- pictures drawn at their box's width ---------- */
const VIZ = {
  tl: (el, a) => QBY[a] ? qTimelineSVG(QBY[a], el.clientWidth) : "",
  pool: el => PAIRS.length ? pooledSVG(el.clientWidth) : "",
  lg: (el, a) => R[+a] ? localGraphSVG(+a, el.clientWidth) : "",
};
function drawViz(root = document) {
  root.querySelectorAll("[data-viz]").forEach(el => {
    const [k, a] = el.dataset.viz.split(":");
    if (!VIZ[k] || !el.clientWidth) return;
    el.innerHTML = VIZ[k](el, a);
    el.dataset.w = el.clientWidth;
    const svg = el.querySelector("svg");
    if (!svg) return;
    if (k === "pool") wirePooled(svg);
    if (k === "lg") { placeLabels(svg); wireLGHover(svg); }
    if (DP) depsAfterDraw(k, a, svg);
  });
}

/* ---------- hover previews (Quartz-style) ---------- */
const POP = {
  rec(i) {
    const r = R[+i]; if (!r) return "";
    const p = P[r.p], K = KMAP[r.k] || [r.k, human(r.k)], rv = REVIEW[r.rv];
    return `<div class="pk">${kicon(r.k, 12)}<span>${esc(K[1])}</span><span>·</span><span>${esc(p.short)}, page ${esc(r.pg)}</span>${rv ? `<span class="badge"><i style="background:${rv[1]}"></i>${esc(rv[0])}</span>` : ""}</div>
      <div class="pt">${esc(r.t)}</div>${r.q ? `<div class="pq">“${esc(flow(r.q))}”</div>` : ""}`;
  },
  step(id) {
    const n = CN[id], s = STEP[id];
    if (!n && !s) return "";
    const q = stepQs(id).length, ev = n ? n.ev : s.label;
    return `<div class="pk">${n ? glyphSVG(n, 14) : ""}<span>${esc(n ? (n.pl || NKIND[n.kind] || n.kind) : id)}</span></div><div class="pt">${esc(n ? n.label : s.step)}</div>
      <div class="pm"><span class="evk"><i class="sn ${evCls(ev)}"></i>Evidence: ${esc(human(ev).toLowerCase())}</span> · ${q ? `<span class="bn">${q}</span> ${q === 1 ? "open question" : "open questions"}` : "no open question"}</div>`;
  },
  q(id) {
    const q = QBY[id]; if (!q) return "";
    return `<div class="pk">${statusSVG(q.status, 14)}<span>Rank ${q.rank} · ${esc(human(q.status))}</span></div><div class="pt">${esc(q.question)}</div>${CASE ? miniTL(q, 120) : ""}`;
  },
  pair(k) {
    const p = PAIRS[+k]; if (!p) return "";
    return `<div class="pk"><svg width="12" height="12" aria-hidden="true"><circle class="pd ${p.source === "quoted" ? "dq" : "df"}" cx="6" cy="6" r="4.4"/></svg><span>${esc(p.cite)} · ${esc(srcLabel(p.source))}</span></div>
      <div class="pv">${esc(sgn(p.gap))} points</div>
      <div class="pm">Debate <b>${esc(p.debate)}</b> vs ${esc(baseLabel(p.against))} <b>${esc(p.baseline)}</b></div>
      <div class="pm">Judge · ${esc(judgeLabel(p.judge))}${p.judge_model ? ` · ${esc(p.judge_model)}` : ""}</div>
      <div class="pm">Task · ${esc(p.task)}</div>`;
  },
  fd(key) {
    const [qid, n] = key.split("|"), q = QBY[qid], x = q && qFindings(q)[+n - 1];
    if (!x) return "";
    const {pid, title} = splitLP(x.f.later_paper);
    return `<div class="pk"><span class="eff e-${esc(x.f.effect)}" style="padding:0 8px">${esc(effLabel(x.f.effect))}</span><span>${esc(monthYear(x.f.first_submitted))}</span>${pid ? `<span class="mono">${esc(pid)}</span>` : ""}</div><div class="pt">${x.n}. ${esc(title)}</div>`;
  },
  ask(qid) { const q = QBY[qid]; return q ? `<div class="pk">Asked ${esc(monthYear(q.asked_on))}${q.asked_version ? ` · <span class="mono">${esc(q.asked_version)}</span>` : ""}</div><div class="pt">${esc(q.asked_by)}</div>` : ""; },
  rem(qid) { const q = QBY[qid]; return q && q.remaining_question ? `<div class="pk">What is left</div><div class="pq" style="-webkit-line-clamp:6">${esc(q.remaining_question)}</div>` : ""; },
};
const pop = $("#pop"), POPSEL = "[data-pop], a[href^='#r']:not(.card)";
let popT = null, popEl = null;
function popHTML(el) {
  const k = el.dataset.pop;
  if (k) { const j = k.indexOf(":"), fn = POP[k.slice(0, j)]; return fn ? fn(k.slice(j + 1)) : ""; }
  const m = (el.getAttribute("href") || "").match(/^#r(\d+)$/);
  return m ? POP.rec(m[1]) : "";
}
function showPop(el) {
  const html = popHTML(el);
  if (!html) { hidePop(); return; }
  clearTimeout(popT); hideTip();
  pop.innerHTML = html; pop.hidden = false; popEl = el;
  const r = el.getBoundingClientRect(), w = pop.offsetWidth, h = pop.offsetHeight;
  let y = r.bottom + 8;
  if (y + h > innerHeight - 8) y = r.top - h - 8;
  if (y < 8) y = Math.max(8, Math.min(innerHeight - h - 8, r.bottom + 8));
  const x = Math.max(8, Math.min(r.left + Math.min(r.width / 2, 24) - 16, innerWidth - w - 8));
  pop.style.left = x + "px"; pop.style.top = y + "px";
}
function hidePop() { clearTimeout(popT); if (pop) pop.hidden = true; popEl = null; }
document.addEventListener("mouseover", e => {
  if (matchMedia("(hover: none)").matches || e.target.closest?.(".ownpop")) return;
  const el = e.target.closest?.(POPSEL);
  if (el === popEl) return;
  clearTimeout(popT);
  if (!el || !popHTML(el)) { if (popEl) hidePop(); return; }
  popT = setTimeout(() => showPop(el), popEl ? 0 : 110);
});
document.addEventListener("focusin", e => {
  const el = e.target.closest?.(POPSEL);
  if (el && el.matches(":focus-visible") && popHTML(el)) showPop(el); else if (popEl) hidePop();
});
addEventListener("scroll", () => { if (popEl) hidePop(); }, true);

/* ---------- previews for the new views ---------- */
Object.assign(POP, {
  fam(id) {
    const f = FAMI[id]; if (!f) return "";
    return `<div class="pk"><span>${esc(f.kind)}</span><span>·</span><span class="mono">${esc(f.id)}</span></div><div class="pt">${esc(f.name)}</div>
      <div class="pm"><b>${f.results}</b> ${f.results === 1 ? "result uses it" : "results use it"} · <b>${f.steps.length}</b> ${f.steps.length === 1 ? "step names it" : "steps name it"}${f.steps_state !== "AI_CHECKED" ? " · link not yet checked" : ""}</div><div class="pq">${esc(f.definition)}</div>`;
  },
  fp(key) {
    const [pi, id] = key.split("|"), f = FAMI[id], gs = fpData().by[key] || [];
    if (!f || !gs.length) return "";
    return `<div class="pk"><i class="kd" style="border-radius:2px;background:var(--fp${fpStep(gs.length)})"></i><span>${esc(f.name)}</span></div><div class="pt">${esc(+pi >= 0 ? P[+pi].short : "Other")} · ${plural(gs.length, "result")}</div>
      ${gs.slice(0, 4).map(g => `<div class="pm">${g.hv === false ? `<span class="unv sm">not verified</span>` : ""}${esc(gTitle(g))}</div>`).join("")}${gs.length > 4 ? `<div class="pm">and ${gs.length - 4} more</div>` : ""}<div class="pm">Click to open them in the family panel</div>`;
  },
  cell(key) {
    const [k, id] = key.split("|"), g = DP.grid[+k], f = FAMI[id];
    if (!g || !f || !g.cells[id]) return "";
    const p = gPaper(g);
    return `<div class="pk"><i class="gd" style="display:inline-block"></i><span>${esc(f.name)}</span></div><div class="pt">${esc(gTitle(g))}</div>
      <div class="pm">${p ? `${esc(p.short)} · ` : ""}${esc(g.cells[id].map(unitLab).join(", "))}</div>${g.hv === false ? `<div class="pm"><span class="unv" style="margin:0">hypotheses not verified</span></div>` : ""}`;
  },
  pn(key) {
    const j = key.lastIndexOf("|"), pg = pgOf(key.slice(0, j)), n = pg && pg.nodes[+key.slice(j + 1)];
    if (!n) return "";
    const qs = n.problems.map(id => [id, pg.problems.find(q => q.id === id), DP.problems[id] || {}]);
    return `<div class="pk">${pGlyphSVG(n, 14)}<span>${esc(n.kind)}</span>${n.page ? `<span>·</span><span>page ${esc(n.page)}</span>` : ""}${nvNode(n) ? `<span class="unv" style="margin:0">hypotheses not verified</span>` : ""}</div><div class="pt">${esc(n.label)}</div>
      ${qs.slice(0, 3).map(([id, q, d]) => `<div class="pm"><span class="tag sev-${esc(q ? q.severity : "")}" style="margin:0 6px 0 0">${esc(human(q ? q.severity : ""))}</span>${esc(d.what || id)}</div>`).join("")}${qs.length > 3 ? `<div class="pm">and ${qs.length - 3} more audit problems</div>` : ""}
      ${n.rs.length ? `<div class="pm">${n.rs.length === 1 ? "Opens its record page" : `Opens the first of ${n.rs.length} record pages`}</div>` : ""}`;
  },
  pe(key) {
    const j = key.lastIndexOf("|"), pg = pgOf(key.slice(0, j)), e = pg && pg.edges[+key.slice(j + 1)];
    if (!e) return "";
    const verb = e.how === "mentions" ? "mentions" : "uses";
    return `<div class="pk"><span>${verb === "uses" ? "applies" : "mentions"}</span><span>·</span><span>${esc((REVIEW[e.state] || [human(e.state)])[0])}</span></div><div class="pt">${esc(e.from)} ${verb} ${esc(e.to)}</div>
      <div class="pm">p.${esc(e.page)} l.${esc(e.line)} · cited by ${esc(e.cited_by)}</div><div class="pm">Opens page ${esc(e.page)} of the PDF ↗</div>`;
  },
  ln(key) {
    const j = key.lastIndexOf("|"), lp = lpOf(key.slice(0, j)), n = lp && lp.nodes[+key.slice(j + 1)];
    if (!n) return "";
    return `<div class="pk"><span>${esc(n.kind)}</span><span>·</span><span class="mono">${esc(n.file)}:${esc(n.line)}</span></div><div class="pt mono" style="font-size:13px;word-break:break-all">${esc(n.id)}</div>
      <div class="pm"><b>${n.down}</b> ${n.down === 1 ? "declaration depends" : "declarations depend"} on it</div>${n.paper.length ? `<div class="pm">Named in ${esc(n.paper.join(" · "))}</div>` : ""}${n.problems.length ? `<div class="pm">${n.problems.map(id => { const q = lp.problems.find(x => x.id === id); return `<span class="tag sev-${esc(q ? q.severity : "")}" style="margin:0 6px 0 0">${esc(human(q ? q.severity : ""))}</span><span class="mono">${esc(id)}</span>`; }).join(" ")}</div>` : ""}`;
  },
});
Object.assign(VIZ, {
  bridge: el => DP ? bridgeSVG(el.clientWidth) : "",
  bund: el => DP ? bundSVG(el.clientWidth) : "",
  pg: (el, a) => pgOf(a) ? pgSVG(pgOf(a), el.clientWidth) : "",
  lean: (el, a) => lpOf(a) ? leanSVG(lpOf(a), el.clientWidth) : "",
});
function depsAfterDraw(k, a, svg) {
  if (k === "bridge") wireBridge(svg);
  if (k === "bund") wireBund(svg);
  if (k === "pg") applyPg(svg, pgOf(a));
  if (k === "lean") { placeLeanLabels(svg); applyLean(svg, lpOf(a)); }
}
function depsAct(t) {
  const fr = t.closest(".bridge .bf"); if (fr) { hidePop(); S.focusFam = fr.dataset.fam; location.hash = S.fam === fr.dataset.fam ? "assumptions" : "assumptions=" + fr.dataset.fam.toLowerCase(); return true; }
  const bn = t.closest("[data-bf]"); if (bn) { hidePop(); pickBund(bn.dataset.bf, bn.matches(".bnd") ? bn.dataset.bf : null); return true; }
  const pb = t.closest(".pg .pb"); if (pb) { cycleProb(+pb.dataset.pb); return true; }
  const pn = t.closest(".pg .pn"); if (pn) { openPNode(+pn.dataset.pn); return true; }
  const eh = t.closest(".pg .eh"); if (eh) { openPEdge(+eh.dataset.pe); return true; }
  const ln = t.closest(".lg2 [data-ln]"); if (ln) { pickLean(+ln.dataset.ln); return true; }
  return false;
}
document.addEventListener("click", e => {
  if (!DP || !e.target.closest) return;
  if (e.target.closest('a[href^="#assumptions"]:not([data-fp]), .bridge .bf')) S.famPaper = null;
  const fc = e.target.closest("[data-fp]"); if (fc) { const h = fc.getAttribute("href"), id = h.split("=")[1].toUpperCase(); S.famPaper = [id, +fc.dataset.fp]; hidePop(); if (location.hash.toLowerCase() === h) { e.preventDefault(); renderAssumptions(id); } return; }
  const pr = e.target.closest("[data-prob]"); if (pr) { const [sc, ...id] = pr.dataset.prob.split("|"); pickProb(sc, id.join("|")); return; }
  if (e.target.closest("[data-pclear]")) { pickProb("pg", S.prob); return; }
  if (e.target.closest("[data-lclear]")) { const lp = lpOf(S.lproj); S.lsel = null; S.lprob = null; applyLean($(".lg2"), lp); return; }
  depsAct(e.target);
});
document.addEventListener("keydown", e => {
  if (!DP || (e.key !== "Enter" && e.key !== " ") || !e.target.closest) return;
  if (e.target.closest(".bridge .bf, .bund .bnd, .pg .pb, .pg .pn, .pg .eh, .lg2 [data-ln]")) { e.preventDefault(); depsAct(e.target); }
});

/* ---------- tooltip, copy ---------- */
const tip = $("#tip");
function hideTip() { tip.hidden = true; }
document.addEventListener("mouseover", e => {
  const t = e.target.closest?.("[data-tip]"), pe = e.target.closest?.(POPSEL);
  if (!t || !t.dataset.tip || matchMedia("(hover: none)").matches || (pe && t.contains(pe) && popHTML(pe))) { hideTip(); return; }
  tip.textContent = t.dataset.tip; tip.hidden = false;
});
document.addEventListener("mousemove", e => {
  if (tip.hidden) return;
  const w = tip.offsetWidth, h = tip.offsetHeight;
  let x = e.clientX + 14, y = e.clientY + 16;
  if (x + w > innerWidth - 8) x = e.clientX - w - 14;
  if (y + h > innerHeight - 8) y = e.clientY - h - 12;
  tip.style.left = Math.max(8, x) + "px"; tip.style.top = Math.max(8, y) + "px";
});
document.addEventListener("click", e => {
  const b = e.target.closest("[data-copy]"); if (b) copyText(b.dataset.copy, b);
  const w = e.target.closest(".link .why"); if (w && !e.target.closest("a")) w.classList.toggle("open");
  const c = e.target.closest(".clamp"); if (c && !e.target.closest("a") && !c.closest("a")) c.classList.toggle("open");
  const fd = e.target.closest(".fdot"); if (fd) openFinding(fd);
  const mn = e.target.closest(".mtree .mn"); if (mn) { hidePop(); location.hash = "step=" + mn.dataset.step; }
});
document.addEventListener("keydown", e => { const fd = e.target.closest?.(".fdot"); if (fd && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); openFinding(fd); } });
function openFinding(fd) { const d = document.getElementById(fd.dataset.fd); if (d) { d.open = true; hidePop(); d.scrollIntoView({block: "nearest", behavior: "smooth"}); } }
function toast(msg) { const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 1600); }
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); toast("Copied"); }
  catch (e) {
    const box = document.createElement("div"); box.className = "copybox";
    box.innerHTML = `<div><b>Copy this</b><textarea readonly></textarea><button class="btn" type="button">Done</button></div>`;
    box.querySelector("textarea").value = text; document.body.appendChild(box);
    const ta = box.querySelector("textarea"); ta.focus(); ta.select();
    box.querySelector("button").onclick = () => box.remove();
  }
}
let rz, lastW = innerWidth; addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => {
  if (innerWidth !== lastW && $("#tlscroll")) rerenderPapers();
  lastW = innerWidth;
  document.querySelectorAll("[data-viz]").forEach(el => { if (el.clientWidth && +el.dataset.w !== el.clientWidth) drawViz(el.parentNode); });
}, 150); });
boot();
</script>
